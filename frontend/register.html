<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabExplain - Inscription</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
  <header class="site-header simple">
    <div class="logo"><a href="index.html">LabExplain</a></div>
    <div class="right">
      <label class="sr-only" for="lang">Langue</label>
      <select id="lang" aria-label="Choix de la langue">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">AR</option>
      </select>
    </div>
  </header>

  <main class="auth-layout">
    <section class="auth-card large">
      <h1 data-i18n="signup">Inscription</h1>
      <div class="form-grid two">
        <div>
          <label for="nom" data-i18n="lastName">Nom</label>
          <input id="nom" placeholder="Nom">
        </div>
        <div>
          <label for="prenom" data-i18n="firstName">Prénom</label>
          <input id="prenom" placeholder="Prénom">
        </div>
      </div>

      <label for="email" data-i18n="email">Email</label>
      <input id="email" type="email" placeholder="Email">

      <label for="password" data-i18n="password">Mot de passe</label>
      <input id="password" type="password" placeholder="Mot de passe">

      <label for="role" data-i18n="role">Rôle</label>
      <select id="role" onchange="toggleRegFields()">
        <option value="patient" data-i18n="patient">Patient</option>
        <option value="medecin" data-i18n="medecin">Médecin</option>
      </select>

      <div id="patientFields">
        <div class="form-grid two">
          <div>
            <label for="birthdate" data-i18n="birthdate">Date de naissance</label>
            <input type="date" id="birthdate">
          </div>
          <div>
            <label for="gender" data-i18n="gender">Genre</label>
            <select id="gender">
              <option value="M" data-i18n="gender_m">Garçon</option>
              <option value="F" data-i18n="gender_f">Fille</option>
              <option value="O" data-i18n="gender_o">Autre</option>
            </select>
          </div>
        </div>

        <div class="form-grid two">
          <div>
            <label for="weight" data-i18n="weight">Poids (kg)</label>
            <input type="number" id="weight" min="0" placeholder="Poids (kg)">
          </div>
          <div>
            <label for="height" data-i18n="height">Taille (cm)</label>
            <input type="number" id="height" min="0" placeholder="Taille (cm)">
          </div>
        </div>

        <label for="antecedents" data-i18n="antecedents">Antécédents</label>
        <textarea id="antecedents" rows="3" placeholder="Antécédents"></textarea>

        <label for="traitements" data-i18n="treatments">Traitements</label>
        <textarea id="traitements" rows="3" placeholder="Traitements"></textarea>

        <label for="allergies" data-i18n="allergies">Allergies</label>
        <textarea id="allergies" rows="3" placeholder="Allergies"></textarea>
      </div>

      <label class="checkbox-row">
        <input type="checkbox" id="consent">
        <span data-i18n="consentText">J’accepte l’enregistrement local de mes données pour le prototype.</span>
      </label>

      <button type="button" onclick="register()" data-i18n="valider">Valider</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
