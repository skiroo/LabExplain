<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabExplain - Connexion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="auth">
  <header class="site-header simple">
    <div class="logo"><a href="index.html">LabExplain</a></div>
    <div class="right">
      <label class="sr-only" for="lang">Langue</label>
      <select id="lang" aria-label="Choix de la langue">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="es">ES</option>
        <option value="ar">AR</option>
      </select>
    </div>
  </header>

  <main class="auth-layout">
    <section class="auth-card">
      <h1 data-i18n="login">Connexion</h1>
      <p class="muted" data-i18n="authIntro">Accédez à votre espace patient ou médecin.</p>

      <label for="loginEmail" data-i18n="email">Email</label>
      <input id="loginEmail" type="email" autocomplete="email" placeholder="Email">

      <label for="loginPassword" data-i18n="password">Mot de passe</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Mot de passe">

      <button type="button" onclick="login()" data-i18n="login">Connexion</button>
      <p class="muted" data-i18n="noaccount">Pas de compte ?</p>
      <a class="button secondary full" href="register.html" data-i18n="signup">Créer un compte</a>

      <div class="demo-box">
        <p><strong>Demo patient</strong> : patient@test.com / 1235</p>
        <p><strong>Demo médecin</strong> : medecin@test.com / 1234</p>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
